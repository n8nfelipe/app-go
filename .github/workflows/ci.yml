name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Testes, lint, typecheck e código estático
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verificar formatação (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Arquivos fora do padrão gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Typecheck (go build)
        run: go build ./...

      - name: Código estático (go vet)
        run: go vet ./...

      - name: Testes (race + coverage)
        run: go test ./... -race -count=1 -cover

      - name: Lint (golangci-lint — staticcheck, errcheck, ineffassign, unused)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=5m
