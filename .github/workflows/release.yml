name: Release tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    name: Gerar tag semver
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calcular próxima versão e criar tag
        run: |
          set -euo pipefail

          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "HEAD já está marcado com tag; nada a fazer."
            exit 0
          fi

          last_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)

          if [ -z "$last_tag" ]; then
            next="v1.0.0"
          else
            subjects=$(git log --pretty=%s "$last_tag"..HEAD || true)
            bodies=$(git log --pretty=%b "$last_tag"..HEAD || true)

            bump=patch
            if printf '%s\n' "$subjects" | grep -qE '^[a-z]+(\([^)]*\))?!:' || \
               printf '%s\n' "$bodies" | grep -q 'BREAKING CHANGE'; then
              bump=major
            elif printf '%s\n' "$subjects" | grep -qE '^feat(\(|:| )'; then
              bump=minor
            fi

            version=${last_tag#v}
            IFS=. read -r major minor patch <<< "$version"
            case $bump in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            next="v${major}.${minor}.${patch}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "Release $next"
          git push origin "$next"
          echo "Tag criada: $next"
